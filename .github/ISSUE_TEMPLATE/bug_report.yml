name: Bug report
description: Report a problem with D2R PCVR installation or offline VR gameplay.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues first. Please confirm you are using **D2R PCVR**
        from bearstonem/d2r-pcvr, and report the exact version below.
        Do not attach game assets, saves, memory dumps, credentials or account details.
  - type: input
    id: versions
    attributes:
      label: Mod version and game build
      placeholder: "Example: D2R PCVR v0.3.7; D2R 3.3.94995"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Game edition
      options:
        - Steam
        - Battle.net
    validations:
      required: true
  - type: input
    id: headset
    attributes:
      label: Headset and connection/runtime
      placeholder: "Example: Steam Frame with SteamVR; Quest 3 with Virtual Desktop/VDXR"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version and GPU
      placeholder: "Include the GPU driver version if the issue involves rendering."
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include character class, equipped weapons/selected skills, area and transitions if relevant.
      placeholder: |
        1. Load an offline character...
        2. ...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: For visual problems, say whether they affect one eye, both eyes, the desktop or menus only.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Logs
        Reproduce the problem, close the game, then attach these files, zipped (the frame log can be large).
        The paths are for Steam's default library:

        ```text
        C:\Program Files (x86)\Steam\steamapps\common\Diablo II Resurrected\mods\D2R-PCVR\d2rloader\logs\d2r-vr-frame.log
        C:\Program Files (x86)\Steam\steamapps\common\Diablo II Resurrected\mods\D2R-PCVR\d2rloader\logs\d2r-pcvr-vrcam.log
        C:\Program Files (x86)\Steam\steamapps\common\Diablo II Resurrected\mods\D2R-PCVR\reshade\ReShade.log
        C:\Program Files (x86)\Steam\steamapps\common\Diablo II Resurrected\d2rloader\logs\d2rloader.log
        ```

        If the game is elsewhere, open its folder from Steam (right-click Diablo II: Resurrected > Manage > Browse local files)
        or Battle.net (the gear next to Play > Show in Explorer). Developer mode uses `mods\pcvr-dev` in place of `mods\D2R-PCVR`.
        For installation problems, also attach `setup-install.log` and `setup-last.log` from `%LOCALAPPDATA%\Programs\D2R PCVR`
        (paste that into Win+R to open the folder).

        The `d2r-vr-frame.log` and `d2r-vr-vrcam.log` in the game's main `d2rloader\logs` folder are left over from older
        versions and are no longer updated, so please don't send those. Logs show your Windows username in file paths.
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots or recording
      description: Attach the logs above, or share relevant excerpts or a short recording. Remove private information first; do not attach `.dmp` memory dumps, saves or game files.
  - type: checkboxes
    id: offline
    attributes:
      label: Offline testing
      options:
        - label: I reproduced this with an offline local character, or it is an installation/startup issue before entering a game.
          required: true
