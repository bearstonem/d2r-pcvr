light_radius_act1_barracks=16
relief_act1_barracks=1
texture_act1_barracks=D2R_Sky_ours/D2R_Ceiling_act1_barracks_smooth.png
; per dungeon: stone contrast / detail / wet shine; the cathedral: flat, with a dome over what stands higher
; the catacombs as the jail
contrast_act1_caves=2
detail_act1_caves=0.85
wet_act1_caves=0.35
contrast_act1_crypt=2
