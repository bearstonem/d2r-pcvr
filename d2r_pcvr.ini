head_skip=1
; Draw-thread sampler (a diagnostic, not for normal play; steamvr/PERFORMANCE.md): change draw_sampler to a new number
; other than 0 while in the world, in the headset, and for draw_sampler_seconds (30; 1-300) from the first eye pass drawn
; the thread that draws the eyes is stopped for about 20 millionths of a second a thousand times a second, to see where
; its time goes: the game, the GPU driver, D3D12, ReShade, this mod, waiting. It ends by itself and reports as
; "Frame draw sampler:" lines in d2r-vr-frame.log and in full in d2r-vr-draw-sampler.txt beside that log (written anew
; by each capture). It costs the eye passes a few percent while it runs. 0 ends a running capture early. Put it back
; to 0 afterwards: a number left here starts a capture at the next launch.
; draw_sampler_tasks: the game draws an eye as some 22 render tasks on its worker threads and the draw thread waits for
; them. The threads that run the tasks named here are sampled the same way while they run them (at most three such
; threads at a tick beside the draw thread), and the report has a table of each task: whose code, waiting or running,
; its top functions. Parts of the task names in the report's table 7, any case, separated by commas; all = every task
; (they take turns, so fewer samples each); none or empty = the draw thread only.
draw_sampler=0
draw_sampler_seconds=30
draw_sampler_tasks=Late Post Processing, Forward Pass, Depth Pass, Collect Draw Calls, Directional Shadows, Shadow Directional Draw Call Collect

