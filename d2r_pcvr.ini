[arms]
; hero's arms: 0 = the game's animation, 1 = test pose (both arms straight ahead), 2 = the VR controllers
mode=2
; 1 = hide the hero's head and neck from your eyes, for a camera right at the eyes (looking down shows the chest)
hide_head=1
; with hide_head in VR's full body view (F4): 1 = the head stays whole so the hero's shadow has one, and your eye views
; draw nothing nearer than about 11 cm in front of your eyes (22 looking up, 3 looking down; a druid's forms and other
; views shrink the head as before); 0 = the head shrinks to the neck, its shadow headless
head_shadow=1
; with head_shadow: how far in front of your eyes nothing is drawn, cm (0-40), looking level, up and down. Raise up if
; looking up shows the inside of the hero's head or helm (a warped circle overhead)
head_cut_level=11
head_cut_up=22
head_cut_down=3
; with head_shadow in F4: 1 = your own helm (helmet, circlet, Druid pelt) is left out of your eye views and kept in the
; hero's shadow, so a long helm's front (a wolf head's snout and teeth) does not hang in front of your face; the head
; itself keeps the cut above. 0 = the helm is drawn and cut like the head
head_skip_draws=1
; arm reach on top of the hero/your height ratio
scale=1
; -1 if the arms swing to the wrong side when the hero turns away from where you look
facing_sign=1
; both hands moved, cm: up (+) / down (-), forward (+) / back (-), right (+) / left (-)
up=0
forward=0
side=0
; % of [camera] distance the hands take along: 100 = they hang off the camera (match your real hands), 0 = off the hero's eyes (always in reach)
follow_camera=100

[body]
; 1 = nothing above the pelvis follows the game's animation (bind pose; arms and hands from the controllers, fingers keep the grip)
lock=1
; the hero turns to where the camera looks: 0 = no (the game's facing), 1 = above the pelvis only, 2 = whole body
turn=2
; degrees added to where the hero faces (arms too) if he stands sideways: try 90 / -90 / 180
yaw=0

[hands]
; where the hero's facing (the doll's binding) comes from: 1 = his TransformComponent in the game's renderer,
; found from his skeleton - bound at once after a weapon swap, an area change or a load; 0 = the memory search
; (docs/doll_binding.md). 1 falls back to the search by itself if it does not read or is a frame late.
facing_source=1
; while no facing reads, the last one is held this long, ms (0 = the doll lets go at once)
facing_hold_ms=4000
; the wrist the game hangs a crossbow on, for its grip: 0 right, 1 left (D2R: left)
xbow_hand=1
; the crossbow's shot line (where the bolt flies, where the left hand takes it), turned onto the model, degrees
xbow_line_pitch=34
xbow_line_yaw=15
; arms mode 2: 1 = the hands turn with the controllers, 0 = they only follow the forearm
wrist=1
; degrees on top of the controller, in its own axes: pitch tips the hand up/down,
; yaw swings it left/right, roll turns it about the forearm (mirrored for the left hand)
pitch=10
yaw=-5
roll=5
; a staff runs through the right hand too: that point moved along the hand's own axes, cm
staff_x=0
staff_y=0
