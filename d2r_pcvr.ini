; 2 = NVIDIA optical flow (RTX or GTX 1660 family). On or off at the next start of the game; native
; Windows only. The game then draws every other headset frame, so it runs with [stereo] rendering=0
; (Eyes drawn per frame: Both) only: on One by turns it pauses, live. NVIDIA's quality (0 slow, 1 medium, 2 fast) and the size it works at (0 100%,
; 1 75%, 2 50%) change while playing
