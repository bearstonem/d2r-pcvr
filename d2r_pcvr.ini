brightness_act1_caves=1.15
light_radius_act1_caves=18
relief_act1_caves=21.5
texture_act1_caves=D2R_Sky_ours/D2R_Ceiling_act1_caves_walls.png
height_act1_crypt=14.5
brightness_act1_crypt=1
light_radius_act1_crypt=18
relief_act1_crypt=1.5
texture_act1_crypt=D2R_Sky_ours/D2R_Ceiling_act1_crypt.png
height_act1_barracks=15.1
