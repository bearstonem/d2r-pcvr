; d2r_pcvr.ini - D2R PCVR's settings, next to d2rl-pcvr.dll in <game>\d2rloader\plugins.
; (Releases up to 0.3.15 used D2R VR's names, d2rl-vrcam.dll and d2r_vr.ini; setup carries them over.)
; vrcam re-reads [camera] [head] [stick] the moment you save this file (game running).
; [render] ; 1 = full frame rate while the game window is behind BodyWalk or the headset (the game sleeps 10 ms a frame there: ~60 fps)
background_full_speed=1
is read when the game starts.

[camera]
; 1 = the FOV follows the FlatVR screen (its size and distance in BodyWalk), like an OpenXR game's view
fov_from_flatvr=1
; vertical FOV of the game camera when fov_from_flatvr=0
fov=64
; camera behind the eye point; below 0 = in front of the face, 45 = upstream 3dcam view
distance=0
; eye point above the ground under the hero (world units)
height=6.3
; 1 = first person: the eyes at the hero's own height, from his rig (sorceress 5.3 .. druid 6.5 units); height is then unused
height_auto=1
; added to that height (world units, ~0.24 m each)
eye_offset=0
; 1 = the camera goes up when the game lifts the hero (the barbarian's Leap, up its whole arc) or the animation raises
; his hips; the held upper body goes with it
follow_jump=1
; a Leap cast while running: the game holds the hero still a moment before the jump; your view glides on through
; it, easing, at most this many cm ahead of him, then rejoins him (0 = the view stops with the hero)
leap_glide_cm=60
; hip rise (model units) still taken for the stride's bob, not a jump; above twice this the camera follows it whole
jump_from=0.3
; pitch on top of the game's own camera (deg), more negative = looks higher; -60 = horizon; BodyWalk sends no head pitch
pitch=-30
; nothing closer than this (world units, ~0.24 m each) is drawn: hides the hero's own head and hair
near=0
; eye point to the right (+) / left (-) of where you look, world units (~0.24 m each);
; the hero's head is off the model's centre line, so without it the eye can sit on a shoulder
side=0
; eye point ahead (+) / behind (-) along where you look, without tilting with the head
forward=0
; 1 = the head turns about the neck (below and behind the eyes), not about the eyes: looking down shows the chest
neck_model=1
; the eyes above and in front of that pivot, cm (scaled to the hero)
neck_up_cm=10
neck_forward_cm=9
shadow_slope=0.5

[head]
; 1 = the head goes on between BodyWalk's updates by its last speed; 0 = as sampled, and FlatVR places the screen
; at the head pose of the sample's own moment (smoother: no guessing in the picture)
predict=0
; 1 = camera yaw follows the headset (needs BodyWalk with D2R Bridge)
yaw_from_head=1
; -1 if turning the head left turns the view right
yaw_sign=-1
yaw_scale=1
; 1 = camera pitch follows the headset too (BodyWalk with head pitch)
pitch_from_head=1
; -1 if looking up tilts the view down
pitch_sign=1
; 1 = tilting the head sideways rolls the camera too
roll_from_head=1
; -1 if tilting the head right tilts the picture the wrong way
roll_sign=1

[stick]
; 1 = exact: the stick goes through the real camera axes (sign/squash unused)
exact=0
; 1 = turn the left stick by the camera yaw, so forward is forward in the view
rotate=1
; -1 if after a head turn forward on the stick walks the wrong way
sign=-1
; <1 if diagonals drift after a turn (isometric screen squash); 1 = off
squash=1
; approximate mode: the stick turns by the camera yaw times this (0.5 = half)
angle_scale=1
; Walk direction (VR Settings > Controls > Hands): 0 = the left stick walks where you look (default),
; 1 = where the left controller points
walk_direction=0

[turn]
; 1 = right stick X turns the body (camera and walking); the game no longer gets the right stick
right_stick=1
; smooth turn speed at full deflection, deg/s
speed=120
; >0 = snap turn by this many degrees per flick (e.g. 30) instead of smooth
snap=0
; -1 if pushing right turns you left
sign=-1

[stereo]
; 1 = native stereo by alternate frames: the game draws left eye, right eye, left...
; needs the FlatVR addon in the game, FlatVR picture source = UEVR (full-size SBS),
; VSync off and a high frame cap (180 fps = 90 per eye)
afr=1
; 1 = both eyes from ONE game frame: the frame is drawn twice (left, then right with the game time held),
; instead of one eye per frame by turns. Same pairs per second; the game itself updates half as often
pair_per_tick=1
; ms of game time the right eye's pass gets instead of none: effects that skip a frame of no time
; (butterflies) are drawn in it then. 0.01 is enough; more moves the world between the eyes
right_dt_ms=0.01
; 1 = the game's own view from above (F12 off) in stereo too: each eye turned about the hero by half of top_angle
top_down=1
; degrees between the eyes from above; more = deeper
top_angle=3
; eye separation in world units (hero ~7.5 tall ~ 1.8 m, so 0.27 ~ 6.4 cm); more = stronger 3D
; 1 = the world 1:1: eye distance and zero-parallax plane from the FlatVR screen and your head height (ipd and convergence below are then ignored)
true_scale=1
; your own eye distance, millimetres
eye_mm=60
; your height, metres - the scale of the world and of the hands (eyes at 0.936 of it); seated, still your standing height
user_height_m=1.75
ipd=0.16
; 1 if the eyes come out swapped (depth looks inside out)
swap=0
; distance that sits on the FlatVR screen (world units, ~0.24 m each); farther goes deeper behind it.
; 0 = parallel eyes (everything in front of the screen). Smaller = deeper
convergence=0
; the HUD nearer than the FlatVR screen, AFR only: moved apart per eye by the shader, % of the half screen (0 = on the screen)
ui_near=0
; the HUD is looked for below this height, 0 = top of the screen, 1 = bottom
ui_top=0.7
; how many of an eye's views the presented frame lags the newest one (0-3): try 0, 1, 2 for the smoothest head turn
pipeline_depth=0
source=2
headset_rate=3

[fog]
; 1 = distance fog through ReShade (D2R_DepthFog.fx and every D2R_*.fxh beside it must be in reshade-shaders\Shaders); with the sky on it fades into the sky
enabled=1
; where it begins and where it is complete, world units (hero ~7.5 tall); end is VR Settings > Graphics > Environment >
; Fog distance (100-1200)
start=30
end=600
; 1 = linear, more = clearer middle distance, less = thicker close by and see-through far off
curve=0.4
; the fog over a 5x5 grid this many pixels apart (0 = per pixel): holes and specks in the depth melt away
blur=3
; 0 = no added fog in caves and dungeons (every area not on [sky] outdoor); outdoor fog is unchanged
; off by default to preserve the game's own lighting and transparent effects indoors
caves=0
; open-air areas with no added fog either (biome names, as on [sky] outdoor): the River of Flame
; (act4_lava) keeps its lava's own glow and haze; empty = fog in every open-air area
no_fog_areas=act4_lava
; where it begins and where it is complete in caves and dungeons (missing = start / end above)
caves_start=100
caves_end=200
; how much the full fog covers in caves: 1 = all, less = the far end shows through
caves_strength=1
; each act's own fog colour, #RRGGBB (caves of that act too; the sky's low part sinks into it);
; empty = the sky's horizon colour, or dark without a sky
; caves, dungeons, crypts - every area not on [sky] outdoor; empty = that act's colour
color_caves=#000000
color_act1=#303334
color_act2=#625233
color_act3=#364549
color_act4=#5A2712
color_act5=#212934
color_snow=#7E8D99

[sky]
; 1 = a sky in the black void beyond the world, through the same ReShade shader as the fog;
; only in the open air (by the area's biome), hidden while a menu or side panel is open
enabled=1
; 1 = sky everywhere, caves and dungeons too (for testing)
always=0
; per act: brightness, the picture round the viewer (texture_) and the zenith picture (cap_);
; texture_ goes once round, 3:1 (3072x1024), from 8 degrees under the horizon to 65 up;
; cap_ is square (1024x1024), the sky straight up, tiling on every edge;
; bare names are looked for in reshade-shaders\Textures, full paths work too;
; an empty texture_ = the shader draws that sky itself (tools/gen_sky.py paints new ones)
brightness_act1=1
texture_act1=D2R_Sky_ours/D2R_Sky_act1.png
cap_act1=D2R_Sky_ours/D2R_SkyCap_act1.png
brightness_act2=1
texture_act2=D2R_Sky_ours/D2R_Sky_act2.png
cap_act2=D2R_Sky_ours/D2R_SkyCap_act2.png
brightness_act3=1
texture_act3=D2R_Sky_ours/D2R_Sky_act3.png
cap_act3=D2R_Sky_ours/D2R_SkyCap_act3.png
brightness_act4=1
texture_act4=D2R_Sky_ours/D2R_Sky_act4.png
cap_act4=D2R_Sky_ours/D2R_SkyCap_act4.png
brightness_act5=1
texture_act5=D2R_Sky_ours/D2R_Sky_act5.png
cap_act5=D2R_Sky_ours/D2R_SkyCap_act5.png
brightness_snow=1
texture_snow=D2R_Sky_ours/D2R_Sky_snow.png
cap_snow=D2R_Sky_ours/D2R_SkyCap_snow.png
; times each biome's own cloud cover; 0 = clear
clouds=1
; 0 = keep the sky while a side panel (inventory, skills...) shifts the picture
hide_with_panels=1
; 1 = the sky also goes over the dark rim the game leaves round roofs, trees and buildings
; against it (in By turns that rim flickered off them); 0 = the rim stays
cover_rims=1
; biomes that get a sky, comma separated; the log names every biome the game sets
; ("vrcam: biome '...'"), add one here if its area should have a sky
outdoor=act1_outdoors,act1_tristram,act1_court,act2_outdoors,act2_town,act3_jungle,act3_docktown,act3_kurast,act3_travincal_outdoors,act4_mesa,act4_lava,act4_diab,expansion_town,expansion_siege,expansion_mountaintop,expansion_ruins,expansion_ruins_snow,expansion_wildtemple_tempenter
light_day=128
light_night=65

[campfire]
; 1 (the default) = character creation's campfire scene in stereo, round you: stand by the fire with the heroes,
; point at one with the right hand and pull the trigger (or A) - he stands up. 0 = the game's flat screen.
; The installer builds the scene from your game (steamvr/prepare_campfire_sky.py, TUNED_SCENE).
enabled=1
; where you stand: the eyes ahead of the game's camera toward the fire, and above it (world units, ~0.24 m each)
forward=3
up=2.25
; the eye height the scene's scale is taken from (world units): more = the scene smaller round you
eye=6
; the pick: how far along the hand's line its dot lies (world units, about where the heroes stand), and how
; far above the dot the game's pointer is put (the game finds a hero from his middle up)
pick_distance=22
pick_lift=5.5
; 1 = the mod's picture effects (D2R_DepthFog.fx) in the scene too; off by default - the flat screen has none,
; and with the eyes by turns here they flickered
effects=0
; 1 = night round the fire: what lies far off (the game's backdrop and its clouds, which turn with the
; head here, and the floor's end behind you) fades to black - the mod's distance fog, black, from
; night_start to night_end (world units from the eyes; the heroes stand ~22 away)
night=0
night_start=45
night_end=110
; 1 = the game camera takes the head's pose as well (an experiment; the clouds that stood still on the screen
; are taken out of the scene by the installer instead: steamvr/prepare_campfire_sky.py)
sky_cam=0
; 1 = our sky (Act 5's, as [sky] texture_act5 / cap_act5) over the scene: the void over you and above the
; scene's band of mountains, which the game never shows; needs [sky] enabled=1
sky=1
; 1 = once the menu board has its copy, the flat interface is emptied: left in, its name box and buttons
; darkened the scene where they stood on the flat screen (dark right-angled blocks over the heroes' faces)
board_clear=1
; 1 = the menu's lower strip (name box, Create, Back, the checkboxes) on a board standing in the scene - point at
; it and pull the trigger; 0 = as the game draws it, over the eyes and turning with the head
menu_board=1
; the board: its width, how far ahead of the eyes and how far below them it stands as the scene begins (metres);
; the right grip on it moves it
menu_width=1.1
menu_distance=1.0
menu_drop=0.9
; where the strip begins: a share of the game's menu from its top (lower = more of the menu on the board)
menu_top=0.78
; 1 = the picked hero's class and words (the game writes them in its menu above the board's strip) on a board
; of its own over the heroes. Where they lie in the game's menu band (shares of it, 0..1), and the board's width,
; how far ahead of the eyes and how far above them it stands (metres)
caption=1
caption_left=0.25
caption_top=0
caption_right=0.75
caption_bottom=0.33
caption_width=3
caption_distance=6.5
caption_rise=2
; 1 = one picture round the scene, sky and mountains together, in the void beyond it (with [campfire] sky=1):
; on by default: the picture ships as reshade/sky/D2R_Campfire_Pano.png (8192 x 4096); pano_file (a 360-degree equirectangular picture, 2:1) under the mod's reshade-shaders\Textures (D2R_Sky_ours/...), turned by pano_yaw degrees, its bottom row
; pano_low and its top row pano_high degrees over the horizon (-60 / 120: the peaks over the scene's walls); brightness. The picture must exist.
panorama=1
pano_file=D2R_Sky_ours/D2R_Campfire_Pano.png
pano_yaw=0
pano_low=-60
pano_high=120
pano_brightness=1
; The fire's own sound: a roar and crackle while the scene is up (fire_volume, times the game's volume),
; and a click on the fire with the laser: a burst of sparks out of it and a whoosh (fire_burst_volume).
; fire_x/y/z: where the fire burns (world units); fire_pick_radius: how near the ray must pass it.
fire_sound=1
fire_volume=0.9
fire_burst_volume=2
sparks=1
fire_x=1060.67
fire_y=0.3
fire_z=123.94
fire_pick_radius=2.5

[ceiling]
; 1 = a stone vault over the black void in caves, through the same ReShade shader as the sky;
; first person only (VR F4, flat F3), never from above, from behind or on the floor
enabled=1
; 1 = in VR first person (F4) the ceiling is a model the game draws itself - the area's own rock, stone or floor,
; lit by the game's torches, fires and spells and fogged by its fog - made from your game by the installer (Update / repair
; makes it again); the shader's vault stays in flat first person, in an area with no model of its own and wherever the
; game's is not made or not taken (the log says why)
game_ceiling=1
; 1 = in caves its rim bent down to the floor: closes the black void past its edge, but hides big objects beyond it
game_ceiling_wall=0
; 1 = an area with no height_<biome> of its own gets the game's ceiling on its walls' top (the installer measures them)
height_from_walls=1
; the areas whose ceiling the game draws: every dungeon with a model of its own
game_ceiling_biomes=act1_caves,act2_maggot,act3_spider,act3_jungle_dungeon,expansion_icecave,act1_crypt,act1_barracks,act1_catacombs,act1_cathedral,act2_palace_clean,act2_sewer,act2_palace,act2_palace_cells,act2_tomb,act1_court_to_barracks,act3_sewer,act3_temple,act3_travincal,expansion_wildtemple,expansion_baallair,expansion_baallair_throneroom
; how high over the hero's floor, world units (hero ~7.5 tall); under the walls' tops they pierce it
height=18
; world units per tile of the picture (the test grid's cell)
scale=10
brightness=1
; world units from the hero where his light on the ceiling is down to half; farther it goes dark
; (times his Light Radius, [light])
light_radius=25
; 1 = fire seen in the picture (torches, braziers, fire spells) lights the ceiling over it;
; its glow, and world units from the fire where its light is down to half
; VR Settings > Graphics > Environment > Dungeon ceilings' Torches. Off by default: finding the torches reads all the game's memory every
; 1.5 s (VR dropouts on weak PCs, 0.142)
torches=0
torch_brightness=1.8
torch_radius=10
; torches farther than this from the hero (world units) fade out: the next hall's shone over the walls
torch_distance=120
; 1 = the torches the Fallen carry and their shamans' fire light the ceiling too (0: the monsters are not even read);
; their glow, times the torches'
monster_lights=0
monster_brightness=0.65
; how much of the game's own glow round a flame shows over the ceiling and the far floor (1 = all); the flame stays
torch_halo=1
; the torches' light on the stone: 0 the game's own pale colour .. 1 fire's orange-yellow
torch_warmth=0.65
; a wall of the same stone this far round the hero (world units) closes the black void past the floor's edge; 0 = none
wall_distance=230
; stone this far under the hero's floor (world units), seen past the drawn floor's edge; 0 = none
floor_depth=20
; the stone's fine detail times this; how far its grains stand out (world units); glints on wet rock (0 = dry)
contrast=2
detail=0.85
wet=0.35
; how far the rock and its stalactites hang down, world units (0 = flat); steps of the ray through it (the frame's cost)
relief=21.5
steps=12
; the stone's picture, square and tiling (bare names are looked for in reshade-shaders\Textures);
; empty = the shader draws the stone itself
texture=D2R_Sky_ours/D2R_Ceiling_act1_caves_walls.png
; biomes that get a ceiling, comma separated; the log names every biome ("vrcam: biome '...'")
biomes=act1_caves,act1_crypt,act1_barracks,act1_cathedral,act1_catacombs,act2_sewer,act2_palace_clean
; each biome its own height, brightness and light reach (missing = the common ones above)
